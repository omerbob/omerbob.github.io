<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Stochastic topology">
  <!-- Random points joined into a cycle: the empty middle is the hole that
       stochastic topology counts. -->
  <path d="M24 8 40 19 34 38 14 38 8 19Z" fill="none" stroke="#16607e"
        stroke-width="2.4" stroke-linejoin="round"/>
  <g fill="#fff" stroke="#16607e" stroke-width="2.4">
    <circle cx="24" cy="8" r="3.6"/><circle cx="40" cy="19" r="3.6"/>
    <circle cx="34" cy="38" r="3.6"/><circle cx="14" cy="38" r="3.6"/>
    <circle cx="8" cy="19" r="3.6"/>
  </g>
</svg>
